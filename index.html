<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f1">
  <script>
    // Apply the saved theme before the first paint (no flash).
    (function () {
      var m = 'system';
      try { var saved = localStorage.getItem('planner.theme'); if (['light', 'dark', 'sand'].indexOf(saved) >= 0) m = saved; } catch (e) {}
      var theme = m === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
      var colors = { light: '#f3f4f1', dark: '#0d0d0d', sand: '#e6dfd3' };
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme]);
    })();
  </script>
  <meta name="description" content="Log food in grams (raw or cooked), supplements and workouts, and see your expected weight change.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Calorie &amp; Exercise Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="app-title" id="pageTitle">Today</h1>
      <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="datebar" id="datebar" hidden>
      <button class="icon-btn" id="datePrev" aria-label="Previous day">&#8249;</button>
      <label class="date-pick">
        <span id="dateLabel">Today</span>
        <input type="date" id="dateInput" aria-label="Pick a date">
      </label>
      <button class="icon-btn" id="dateNext" aria-label="Next day">&#8250;</button>
      <button class="chip" id="dateToday">Today</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>
      <span>Today</span>
    </a>
    <a href="#/food" data-tab="food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>
      <span>Food</span>
    </a>
    <a href="#/workout" data-tab="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10M4.5 8.5v7M7 7v10M17 7v10M19.5 8.5v7"/></svg>
      <span>Workout</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/></svg>
      <span>Progress</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
