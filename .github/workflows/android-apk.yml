name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'capacitor.config.json'
      - 'package*.json'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLANNER_DEBUG_KEYSTORE: ${{ github.workspace }}/.android/debug.keystore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore test APK signing key
        uses: actions/cache@v6
        with:
          path: .android/debug.keystore
          key: planner-android-debug-key-v1
      - name: Prepare test signing key
        run: |
          mkdir -p "$(dirname "$PLANNER_DEBUG_KEYSTORE")"
          if [ ! -f "$PLANNER_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$PLANNER_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install dependencies
        run: npm ci
      - name: Test planner and native storage
        run: npm test
      - name: Prepare bundled Android app
        run: npm run android:sync
      - name: Ensure Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build test APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --no-daemon
      - name: Package APK and checksum
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/calorie-planner-debug.apk
          cd artifacts/android
          sha256sum calorie-planner-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: calorie-planner-android-debug
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30
